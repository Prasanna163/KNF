name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NCIForge and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,torch-nci,plots]"
          python -m pip install pytest build twine
      - name: Compile source
        run: python -m compileall -q knf_core geoinit nciforge_xtbx nciforge_cli.py
      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Build and validate package
        run: |
          python -m build
          python -m twine check dist/*
