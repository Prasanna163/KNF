services:
  nciforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: nciforge:v1
    container_name: nciforge
    working_dir: /work
    stdin_open: true
    tty: true
    volumes:
      - ./:/work
      - nciforge-cache:/home/mambauser/.knf
    environment:
      NCIFORGE_MULTIWFN_PATH: /opt/Multiwfn/Multiwfn
      KUID_MULTIWFN_PATH: /opt/Multiwfn/Multiwfn
      KNF_MULTIWFN_PATH: /opt/Multiwfn/Multiwfn
      XTBHOME: /opt/conda
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    command: ["example.mol", "--charge", "0", "--force"]

volumes:
  nciforge-cache:

