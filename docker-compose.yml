services:
  kuid:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuid-core:1.0.6
    container_name: kuid-core
    working_dir: /work
    stdin_open: true
    tty: true
    volumes:
      - ./:/work
      - kuid-cache:/home/mambauser/.knf
    environment:
      KUID_MULTIWFN_PATH: /opt/Multiwfn/Multiwfn
      KNF_MULTIWFN_PATH: /opt/Multiwfn/Multiwfn
      XTBHOME: /opt/conda
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    command: ["example.mol", "--charge", "0", "--force"]

volumes:
  kuid-cache:
