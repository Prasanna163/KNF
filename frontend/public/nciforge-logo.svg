<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Hexagon outline -->
  <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" 
        stroke="url(#grad)" stroke-width="4" stroke-linejoin="round" fill="none"/>
  <!-- N letterform with molecular nodes -->
  <!-- Left vertical bar -->
  <line x1="30" y1="70" x2="30" y2="35" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Diagonal -->
  <line x1="30" y1="35" x2="70" y2="65" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Right vertical bar -->
  <line x1="70" y1="65" x2="70" y2="30" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="30" cy="70" r="5" fill="url(#grad)"/>
  <circle cx="30" cy="35" r="4" fill="white" stroke="url(#grad)" stroke-width="2.5"/>
  <circle cx="70" cy="65" r="4" fill="white" stroke="url(#grad)" stroke-width="2.5"/>
  <circle cx="70" cy="30" r="4" fill="white" stroke="url(#grad)" stroke-width="2.5"/>
</svg>
